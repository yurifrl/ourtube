{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.secretStore.name }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "ourtube.fullname" . }}
  labels:
    {{- include "ourtube.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ include "ourtube.fullname" . }}-secrets
    creationPolicy: Owner
  # Pull ALL fields from the remote item; each becomes a key in the generated
  # Secret and is injected into the deployment via envFrom. Name the remote
  # fields exactly as the env vars the app reads (e.g. OT_WEBHOOK_URL_DEFAULT).
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.remoteKey }}
{{- end }}
