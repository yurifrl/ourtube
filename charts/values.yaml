replicaCount: 1

image:
  repository: ghcr.io/yurifrl/ourtube
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  # host: ourtube.local
  # annotations: {}

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce

config:
  pollIntervalSeconds: 300
  logLevel: INFO
  # On first sight of a channel, surface only the latest N videos so its
  # historical backlog never floods the feed. Default 1.
  initialVideosPerChannel: 1
  # ...and only if newer than this many days, so a rarely-posting channel
  # whose latest upload is old surfaces nothing. Default 7.
  initialMaxAgeDays: 7
  # discordWebhookUrl: set via secret

# Channel list, declared inline (works directly in an ArgoCD Application):
# channels:
#   - name: Linus Tech Tips
#     channelId: UCXuqSBlHAE6Xw-yeJA0Tunw
#   - name: RedLetterMedia
#     channelId: UCrTNhL_yO3tPTdQ5XgmmWjA
channels: []

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
