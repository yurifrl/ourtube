{{- if .Values.virtualService.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "ourtube.fullname" . }}
  labels:
    {{- include "ourtube.labels" . | nindent 4 }}
spec:
  gateways:
    {{- toYaml .Values.virtualService.gateways | nindent 4 }}
  hosts:
    {{- toYaml .Values.virtualService.hosts | nindent 4 }}
  http:
    - route:
        - destination:
            host: {{ include "ourtube.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.service.port }}
{{- end }}
