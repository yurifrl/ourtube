apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ourtube.fullname" . }}
  labels:
    {{- include "ourtube.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ourtube.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ourtube.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: ourtube
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: OT_PORT
              value: "3000"
            - name: OT_POLL_INTERVAL_SECONDS
              value: "{{ .Values.config.pollIntervalSeconds }}"
            - name: OT_INITIAL_VIDEOS_PER_CHANNEL
              value: "{{ .Values.config.initialVideosPerChannel | default 1 }}"
            - name: OT_INITIAL_MAX_AGE_DAYS
              value: "{{ .Values.config.initialMaxAgeDays | default 7 }}"
            - name: OT_LOG_LEVEL
              value: "{{ .Values.config.logLevel }}"
            - name: OT_CONFIG_PATH
              value: /config/channels.yaml
          {{- if and .Values.externalSecrets.enabled .Values.externalSecrets.secretStore.name }}
          # All secret fields (e.g. OT_WEBHOOK_URL_DEFAULT) are loaded as env
          # vars from the Secret synced by the ExternalSecret.
          envFrom:
            - secretRef:
                name: {{ include "ourtube.fullname" . }}-secrets
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "ourtube.fullname" . }}-channels
