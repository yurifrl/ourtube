replicaCount: 1

image:
  repository: ourtube
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  # host: ourtube.local
  # annotations: {}

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce

config:
  pollIntervalSeconds: 300
  logLevel: INFO
  # discordWebhookUrl: set via secret

# Channel list, declared inline (works directly in an ArgoCD Application):
# channels:
#   - name: Linus Tech Tips
#     channelId: UCXuqSBlHAE6Xw-yeJA0Tunw
#   - name: RedLetterMedia
#     channelId: UCrTNhL_yO3tPTdQ5XgmmWjA
channels: []

resources: {}
