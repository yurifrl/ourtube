replicaCount: 1

image:
  repository: ghcr.io/yurifrl/ourtube
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  # host: ourtube.local
  # annotations: {}

config:
  pollIntervalSeconds: 300
  logLevel: INFO
  # On first sight of a channel, surface only the latest N videos so its
  # historical backlog never floods the feed. Default 1.
  initialVideosPerChannel: 1
  # ...and only if newer than this many days, so a rarely-posting channel
  # whose latest upload is old surfaces nothing. Default 7.
  initialMaxAgeDays: 7

# External Secrets Operator: sync ALL fields from a remote item into a Secret,
# loaded into the deployment via envFrom. Name the remote fields exactly as the
# env vars the app reads (e.g. OT_WEBHOOK_URL_DEFAULT, OT_WEBHOOK_URL_<GROUP>).
externalSecrets:
  enabled: true
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStore:
    name: ""               # set to your (Cluster)SecretStore name to activate; empty = inert
    kind: ClusterSecretStore  # or SecretStore
  remoteKey: ourtube        # remote item to extract all fields from

# Channel list, declared inline (works directly in an ArgoCD Application):
# channels:
#   - name: Linus Tech Tips
#     channelId: UCXuqSBlHAE6Xw-yeJA0Tunw
#   - name: RedLetterMedia
#     channelId: UCrTNhL_yO3tPTdQ5XgmmWjA
channels: []

resources: {}
